<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Video Player</title>

  <style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #0b0c10;
    color: #f5f5f5;
  }

  h1 {
    margin-bottom: 1.5rem;
  }

  .video-grid {
    display: grid;
    gap: 2rem;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }

  iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
</style>

</head>
  
<body>
  <h1>My Video</h1>

  <video width="720" controls>
    <source src="Videos/分镜1-现代版小红帽.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  
  <video width="720" controls>
    <source src="Videos/分镜2-现代版小红帽.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <h1>Bertie’s Video Gallery</h1>
  
  <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/euoT2DPzS94"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>

 <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/3JWTaaS7LdU"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>

</body>
</html>
